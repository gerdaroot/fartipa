name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test the game core
        run: swift test
      - name: Check that iOS audio can decode every sound
        run: |
          for file in ios/PoopDraw/Sounds/*; do
            afconvert -f caff -d LEI16 "$file" "$RUNNER_TEMP/check.caf"
            afinfo "$RUNNER_TEMP/check.caf" | grep "estimated duration"
          done
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build without signing
        run: |
          xcodebuild build \
            -project PoopDraw.xcodeproj \
            -scheme PoopDraw \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/PoopDraw.app Payload/
          test -f Payload/PoopDraw.app/long-fart.mp3
          test -f Payload/PoopDraw.app/hard-10.m4a
          zip -qr PoopDraw.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: PoopDraw-ipa
          path: PoopDraw.ipa

  screenshots:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build for the simulator
        run: |
          xcodebuild build \
            -project PoopDraw.xcodeproj \
            -scheme PoopDraw \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
      - name: Take screenshots
        run: |
          bash scripts/simulator-screenshots.sh \
            build/Build/Products/Debug-iphonesimulator/PoopDraw.app \
            "$RUNNER_TEMP/screens"
      - name: Publish screenshots to their own branch
        env:
          PUSH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          cd "$RUNNER_TEMP/screens"
          git init -q -b screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "chore: screenshots for ${GITHUB_SHA}"
          git push -f "$PUSH_URL" screenshots
